name: scrape

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node scrape.mjs

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: atualiza matches.json'
          file_pattern: matches.json
          commit_user_name: 'scraper[bot]'
          commit_user_email: 'scraper[bot]@users.noreply.github.com'
